networks:
  trading_mesh:
    driver: bridge

services:
  # ─── SERVICE 1: CORE ENGINE (Starts only after history is verified) ───
  backend-daemon:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: trading_backend_daemon
    restart: unless-stopped
    networks:
      - trading_mesh
    ports:
      - "8080:8080"
    volumes:
      # ✅ FIX: Root project mounts FIRST to prevent folder path collisions!
      - .:/app
      # ✅ FIX: Mapped folder nests perfectly on top, securing direct host disk writes!
      - ./logs:/app_storage
    env_file:
      - .env
    environment:
      - BACKEND_HOST=0.0.0.0
      - APP_ENV=development
      - LOG_LEVEL=INFO
    depends_on:
      - historical-data-seeder
    cpuset: "2,3"
    ulimits:
      memlock: -1
      rtprio: 99
    cap_add:
      - SYS_NICE
    init: true

  # ─── SERVICE 2: THE AUTOMATED HISTORY INJECTOR ───
  historical-data-seeder:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: trading_historical_seeder
    networks:
      - trading_mesh
    volumes:
      # ✅ FIX: Sequenced accurately to match the core engine and protect persistence!
      - .:/app
      - ./logs:/app_storage
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    command: [ "python", "-m", "research.seed_historical_yfinance" ]

  # ─── SERVICE 3: USER INTERFACE DASHBOARD ───
  dashboard-ui:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: trading_streamlit_ui
    restart: unless-stopped
    networks:
      - trading_mesh
    ports:
      - "8501:8501"
    volumes:
      # ✅ FIX: Synchronised layout structure across all services
      - .:/app
      - ./logs:/app_storage
    depends_on:
      - backend-daemon
    env_file:
      - .env
    environment:
      - BACKEND_HOST=backend-daemon
      - BACKEND_PORT=8080
      - PYTHONPATH=/app
    cpuset: "0,1"
