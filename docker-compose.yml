networks:
  trading_mesh:
    driver: bridge

volumes:
  shared_logs:
    driver: local

services:
  # ─── SERVICE 1: CORE ENGINE (Starts only after history is verified) ───
  backend-daemon:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: trading_backend_daemon
    restart: unless-stopped
    networks:
      - trading_mesh
    ports:
      - "8080:8080"
    volumes:
      - shared_logs:/app/logs
      - .:/app
    env_file:
      - .env
    environment:
      - BACKEND_HOST=0.0.0.0
      - APP_ENV=development
      - LOG_LEVEL=INFO
    depends_on:
      historical-data-seeder:
        condition: service_completed_successfully # Waits for data seeding to finish
    cpuset: "2,3"
    ulimits:
      memlock: -1
      rtprio: 99
    cap_add:
      - SYS_NICE
    init: true

  # ─── SERVICE 2: THE AUTOMATED HISTORY INJECTOR (New) ───
  historical-data-seeder:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: trading_historical_seeder
    networks:
      - trading_mesh
    volumes:
      - shared_logs:/app/logs
      - .:/app
    env_file:
      - .env
    # Overrides the default runtime application launch command to run your safe seeder script
    command: ["python", "-m", "research.seed_historical_yfinance"]

  # ─── SERVICE 3: USER INTERFACE DASHBOARD ───
  dashboard-ui:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: trading_streamlit_ui
    restart: unless-stopped
    networks:
      - trading_mesh
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - backend-daemon
    env_file:
      - .env
    environment:
      - BACKEND_HOST=backend-daemon
      - BACKEND_PORT=8080
    cpuset: "0,1"
